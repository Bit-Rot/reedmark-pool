name: Dice Pool Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the shared revision
        id: revision
        run: |
          read -r ref < SOURCE_COMMIT
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: Bit-Rot/reedmark-five
          ref: ${{ steps.revision.outputs.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - working-directory: source
        run: |
          npm ci
          npm run check
          npm test
          npm run build:pool
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: source/dist/pool
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts | map(select(.expired == false)) | length')
            if [[ "$count" -gt 0 ]]; then
              exit 0
            fi
            sleep 3
          done
          echo "GitHub did not expose the Pages artifact in time" >&2
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
